[ScalabilityGroups]
; Default quality for players (they can change it later). The retro look has no Lumen and uses FXAA,
; so render at full resolution: upscaling would only blur the crisp low-res textures.
sg.ResolutionQuality=100
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=2
sg.ReflectionQuality=3
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3
